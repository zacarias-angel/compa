services:
  back:
    build: ./back
    container_name: compa-back
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - COMPA_PASSWORD=${COMPA_PASSWORD:-}
      - WA_URL=http://wa:3001
      - WA_PHONE=${WA_PHONE:-}
    networks:
      - compa
    depends_on:
      - wa
    restart: unless-stopped

  wa:
    build: ./wa
    container_name: compa-wa
    environment:
      - AUTH_DIR=/data
    volumes:
      - wa-data:/data
    networks:
      - compa
    restart: unless-stopped

  front:
    build: ./front
    container_name: compa-front
    environment:
      - BACKEND_HOST=back
    networks:
      - compa
    ports:
      - "3000:80"
    depends_on:
      - back
    restart: unless-stopped

networks:
  compa:
    driver: bridge

volumes:
  wa-data:
