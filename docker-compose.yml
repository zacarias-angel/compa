services:
  back:
    build: ./back
    container_name: compa-back
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    networks:
      - compa
    restart: unless-stopped

  front:
    build: ./front
    container_name: compa-front
    environment:
      - BACKEND_HOST=back
    networks:
      - compa
    ports:
      - "3000:80"
    depends_on:
      - back
    restart: unless-stopped

networks:
  compa:
    driver: bridge
