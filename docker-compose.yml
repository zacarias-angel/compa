services:
  back:
    build: ./back
    container_name: compa-back
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - COMPA_PASSWORD=${COMPA_PASSWORD:-}
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_TOPIC=${MQTT_TOPIC:-compa/device}
    networks:
      - compa
    depends_on:
      - mqtt
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: compa-mqtt
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - compa
    restart: unless-stopped

  front:
    build: ./front
    container_name: compa-front
    environment:
      - BACKEND_HOST=back
    networks:
      - compa
    ports:
      - "3000:80"
    depends_on:
      - back
    restart: unless-stopped

networks:
  compa:
    driver: bridge
